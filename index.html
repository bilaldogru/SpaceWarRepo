<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <title>Space War</title>

    <!-- Space War Yazı Tipi Daha Etkileyici Olması İçin Hazır Fontlar -->
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;700&display=swap"
        rel="stylesheet">

    <!-- Space War CSS Kodları -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Canvas Kullanarak Yıldız Animasyonu Üretimi -->
    <canvas id="yildiz-alani"></canvas>

    <!-- Oyunun Ana Arayüzü -->
    <div class="arayuz-kapsayici">

        <!-- Ana Menü Ekranı -->
        <div id="ana-menu" class="ekran-icerigi">

            <div class="baslik-kapsayici">
                <h1 class="baslik-space">SPACE</h1>
                <h2 class="baslik-war">WAR</h2>
            </div>

            <div class="buton-grubu">
                <br><br>
                <button id="basla-btn" class="oyun-butonu">BASLA</button>
                <button id="hakkinda-btn" class="oyun-butonu">HAKKINDA</button>
                <button id="cikis-btn" class="oyun-butonu">CIKIS</button>
            </div>

        </div>

        <!-- Oyun Ekranı -->
        <div id="oyun-alani" class="ekran-icerigi"
            style="display: none; width: 100vw; height: 100vh; position: relative; overflow: hidden;">

            <!-- Taktiksel Gezegen Haritası  -->
            <div class="gezegen-haritasi" style="width: 100%; height: 100%; position: absolute; top: 0; left: 0;">

                <!-- MERKEZDEKİ YAZI -->
                <div class="secim-baslik"
                    style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 5;">
                    <h2 class="panel-baslik"
                        style="font-size: 55px; margin-bottom: 5px; text-shadow: 0 0 20px #5ae0ff;">Gezegen Sec</h2>
                    <p class="panel-metin"
                        style="font-size: 20px; color: #a0aabf; margin-bottom: 0; text-shadow: none;">Savunma haritasini
                        secmek icin bir gezegene tikla</p>
                </div>

                <!-- Gezegen 1: Astra (SOL ÜST KÖŞE) -->
                <div class="harita-noktasi astra" style="top: 15%; left: 10%;">
                    <div class="gezegen-halka"></div>
                    <div class="gezegen-kure"></div>
                    <div class="gezegen-isim">Astra</div>
                </div>

                <!-- Gezegen 2: Vega (SAĞ ÜST KÖŞE) -->
                <!-- Dikkat: Sağa yaslamak için 'left' yerine 'right' kullandık -->
                <div class="harita-noktasi vega" style="top: 15%; right: 10%;">
                    <div class="gezegen-halka"></div>
                    <div class="gezegen-kure"></div>
                    <div class="gezegen-isim">Vega</div>
                </div>

                <!-- Gezegen 3: Kron (SOL ALT KÖŞE) -->
                <div class="harita-noktasi kron" style="bottom: 20%; left: 10%;">
                    <div class="gezegen-halka"></div>
                    <div class="gezegen-kure"></div>
                    <div class="gezegen-isim">Kron</div>
                </div>

                <!-- Gezegen 4: Nora (SAĞ ALT KÖŞE) -->
                <div class="harita-noktasi nora" style="bottom: 20%; right: 10%;">
                    <div class="gezegen-halka"></div>
                    <div class="gezegen-kure"></div>
                    <div class="gezegen-isim">Nora</div>
                </div>

            </div>

            <!-- OYUN İÇİ ARAYÜZ (HUD) - Başlangıçta Gizli -->
            <div id="oyun-hud" class="oyun-hud" style="display: none;">

                <!-- Üst Bar: Taretler ve Statlar -->
                <div class="hud-ust-bar">

                    <!-- Taret Slotları (5 Tane) -->
                    <div class="hud-taret-panel">
                        <div class="taret-slot"><span class="taret-numara">1</span></div>
                        <div class="taret-slot"><span class="taret-numara">2</span></div>
                        <div class="taret-slot"><span class="taret-numara">3</span></div>
                        <div class="taret-slot kilitli"><span class="taret-numara">4</span></div>
                        <div class="taret-slot kilitli"><span class="taret-numara">5</span></div>
                    </div>

                    <!-- Oyuncu Statları -->
                    <div class="hud-stat-panel">
                        <div class="hud-stat-kutu">Us Can: <span id="hud-can">100</span></div>
                        <div class="hud-stat-kutu">Gemi Can: <span id="hud-oyuncu-can">100</span></div>
                        <div class="hud-stat-kutu">Para: <span id="hud-para">200</span></div>
                        <div class="hud-stat-kutu">Mermi: <span id="hud-mermi">15</span></div>
                    </div>

                    <!-- Ana Menüye Dönüş -->
                    <button id="hud-ana-menu-btn" class="oyun-butonu kucuk-buton hud-menu-btn">Menu</button>
                </div>

                <!-- Alt Bilgi Barı: Süre ve Turn -->
                <div class="hud-alt-bar">
                    <div>Gecen Sure: <span id="hud-sure">00:00</span></div>
                    <div>Turn: <span id="hud-turn">1</span> / 5 | Dusman: <span id="hud-dusman">0</span></div>
                </div>

                <!-- Galaxy Radar: Düşman ordusu uzaktan görünümü -->
                <canvas id="galaxy-radar" width="220" height="140"></canvas>
            </div>

        </div>

        <!-- Hakkında Ekranı -->
        <div id="hakkinda-alani" class="ekran-icerigi panel-kutusu" style="display: none;">
            <h2 class="panel-baslik">Space War Hikayesi</h2>
            <div id="hikaye-icerik" class="panel-metin">
                <!-- Hikaye.txt buradan yüklenecek -->
                Yükleniyor...
            </div>
            <br>
            <button id="hakkinda-geri-btn" class="oyun-butonu kucuk-buton">ANA MENU</button>
        </div>
        <!-- Space War JavaScript Kodları -->
        <script type="module" src="js/main.js"></script>
    </div>

</body>

</html>
